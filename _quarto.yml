project:
  type: website
  output-dir: docs

execute:
  freeze: auto  # Re-render only when source changes

website:
  navbar:
    background: light
    logo: img/logo_branco_ufpe.png
    logo-alt: "UFPE logo"
    title: false
    collapse-below: lg
    left:
      - text: "Início"
        href: index.qmd
      - text: "Objetivos"
        href: objetivos.qmd
      - text: "Cronograma"
        href: schedule.qmd
      - text: "Seu próprio site"
        icon: "tools"
        href: workbook/workbook.qmd
      - text: "Todas as Aulas"
        href: sessions/index.qmd
      # - text: "Exercícios"
      #   href: exercises/index.qmd
      # - text: "Recursos"
      #   href: resources/index.qmd
      - text: "Avaliação"
        href: trabalho_final.qmd
      # - text: "Prova Final"
      #   href: avaliacao_final.qmd
  
  
 
  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var instructor.name_no_title >}}]({{< var instructor.url >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})
    center: |
      Transparência no Uso de Tecnologias: Os conteúdos didáticos disponibilizados nesta plataforma contaram com o auxílio de ferramentas de IA em seu processo de elaboração. Todo o escopo teórico e bibliográfico foi definido exclusivamente pelo docente, que conduziu a checagem integral dos dados e a validação do conteúdo, garantindo a observância dos parâmetros pedagógicos e científicos aplicáveis à disciplina
    
format:
  html:
    theme: styles.scss
    #css: styles.css
    toc: false
    page-layout: full